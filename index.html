<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест API OpenWeather</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #1a1a2e; color: white; }
        .result { 
            background: #16213e; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow: auto;
        }
        .success { border-left: 4px solid #00ff88; }
        .error { border-left: 4px solid #ff4444; }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            background: #0f3460;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover { background: #1a4a7a; }
    </style>
</head>
<body>
    <h1>🧪 Тест API ключа</h1>
    <p>Ключ: <code>14a59e09e05d619c475cc278bffc4d89</code></p>
    
    <button onclick="testClouds()">☁️ Тест облаков</button>
    <button onclick="testLightning()">⚡ Тест молний</button>
    <button onclick="testCurrentWeather()">🌤️ Текущая погода</button>
    
    <div id="results"></div>

    <script>
        const API_KEY = '14a59e09e05d619c475cc278bffc4d89';
        
        function addResult(title, data, isError = false) {
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `<strong>${title}</strong>\n${JSON.stringify(data, null, 2)}`;
            document.getElementById('results').appendChild(div);
        }
        
        async function testClouds() {
            try {
                const url = `https://tile.openweathermap.org/map/clouds_new/5/10/10.png?appid=${API_KEY}`;
                const response = await fetch(url);
                addResult('☁️ Облака (tile URL)', {
                    url: url,
                    status: response.status,
                    statusText: response.statusText,
                    contentType: response.headers.get('content-type'),
                    size: response.headers.get('content-length')
                });
                
                // Проверка через image
                const img = new Image();
                img.onload = () => addResult('☁️ Изображение загрузилось', {
                    width: img.width,
                    height: img.height,
                    src: url
                });
                img.onerror = () => addResult('☁️ Ошибка загрузки изображения', {
                    url: url,
                    status: 'image load failed'
                }, true);
                img.src = url;
            } catch (e) {
                addResult('☁️ Ошибка', e.message, true);
            }
        }
        
        async function testLightning() {
            try {
                const lat = 55.75;
                const lon = 37.61;
                const radius = 1000;
                const dt = Math.floor(Date.now() / 1000);
                const url = `https://api.openweathermap.org/data/2.5/lightning?lat=${lat}&lon=${lon}&radius=${radius}&dt=${dt}&appid=${API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                addResult('⚡ Молнии', {
                    url: url,
                    status: response.status,
                    data: data
                }, !response.ok);
            } catch (e) {
                addResult('⚡ Ошибка', e.message, true);
            }
        }
        
        async function testCurrentWeather() {
            try {
                const lat = 55.75;
                const lon = 37.61;
                const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=ru`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                addResult('🌤️ Текущая погода (Москва)', {
                    url: url,
                    status: response.status,
                    data: data
                }, !response.ok);
            } catch (e) {
                addResult('🌤️ Ошибка', e.message, true);
            }
        }
    </script>
</body>
</html>
