<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Geometry Dash — Stereo Rush</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;touch-action:none;font-family:Arial}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%}
#rotate{position:fixed;inset:0;background:#111827;color:white;display:none;z-index:10;align-items:center;justify-content:center;text-align:center;font-size:22px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="rotate">ПЕРЕВЕРНИ ТЕЛЕФОН<br><br>ИГРА В ГОРИЗОНТАЛЬНОМ РЕЖИМЕ</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

let W,H;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
window.addEventListener('resize',resize);
resize();

const TILE=42;
const GROUND=0;
const SPEED=360;
const GRAVITY=2200;
const JUMP=-770;

let player;
let cam=0;
let started=false;
let dead=false;
let won=false;
let attempts=1;
let progress=0;
let particles=[];
let flash=0;
let jumpPressed=false;
let last=0;
let levelLength=7900;
let menu=true;

const obstacles=[
 // Первый участок
 {x:500,type:'spike'},
 {x:720,type:'spike'},
 {x:920,type:'double'},
 {x:1240,type:'spike'},
 {x:1430,type:'block'},
 {x:1600,type:'spike'},
 {x:1800,type:'double'},
 {x:2080,type:'triple'},
 {x:2450,type:'spike'},
 {x:2630,type:'blockspike'},
 {x:2860,type:'double'},
 {x:3120,type:'spike'},
 {x:3350,type:'triple'},
 {x:3740,type:'double'},
 {x:3990,type:'block'},
 {x:4180,type:'spike'},
 {x:4410,type:'triple'},
 {x:4730,type:'double'},
 {x:5020,type:'spike'},
 {x:5240,type:'blockspike'},
 {x:5480,type:'double'},
 {x:5770,type:'triple'},
 {x:6150,type:'spike'},
 {x:6350,type:'double'},
 {x:6600,type:'block'},
 {x:6810,type:'triple'},
 {x:7110,type:'double'},
 {x:7410,type:'spike'},
 {x:7650,type:'triple'}
];

function makePlayer(){
 return {x:180,y:GROUND-40,w:34,h:34,vy:0,rot:0,onGround:true};
}

function reset(){
 player=makePlayer();
 cam=0;dead=false;won=false;particles=[];
 flash=0;progress=0;started=true;menu=false;
}

function start(){
 attempts=1;
 reset();
}

function restart(){
 attempts++;
 reset();
}

function jump(){
 if(!started||dead||won||menu)return;
 if(player.onGround){
  player.vy=JUMP;
  player.onGround=false;
  jumpPressed=true;
 }
}

canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(menu){start();return;}
 if(dead||won){restart();return;}
 jump();
});

window.addEventListener('keydown',e=>{
 if(['Space','ArrowUp','KeyW'].includes(e.code))e.preventDefault();
 if(e.repeat)return;
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
  if(menu)start();
  else if(dead||won)restart();
  else jump();
 }
});
window.addEventListener('keyup',e=>{
 if(e.code==='Space')jumpPressed=false;
});

function spike(x){
 return {x,y:GROUND-40};
}

function getObstacles(){
 let arr=[];
 for(const o of obstacles){
  let x=o.x;
  if(o.type==='spike'){
   arr.push(spike(x));
  }
  if(o.type==='double'){
   arr.push(spike(x));arr.push(spike(x+42));
  }
  if(o.type==='triple'){
   arr.push(spike(x));arr.push(spike(x+42));arr.push(spike(x+84));
  }
  if(o.type==='block'){
   arr.push({x,y:GROUND-42,type:'block'});
  }
  if(o.type==='blockspike'){
   arr.push({x,y:GROUND-42,type:'block'});
   arr.push(spike(x+42));
  }
 }
 return arr;
}
const all=getObstacles();

function collision(){
 const px=player.x,py=player.y;
 for(const o of all){
  let ox=o.x-cam+player.x;
  if(ox<-100||ox>W+100)continue;
  if(o.type==='block'){
   if(px+player.w>o.x&&px<o.x+42&&
      py+player.h>GROUND-42&&py<GROUND){
    return true;
   }
  }else{
   // Collision area of spike, intentionally close to GD hitboxes
   let bx=o.x,by=GROUND-40;
   let cx=px+player.w*.5;
   let cy=py+player.h*.7;
   if(cx>bx+8&&cx<bx+34&&cy>by+5&&cy<GROUND){
    return true;
   }
  }
 }
 return false;
}

function burst(){
 for(let i=0;i<28;i++){
  particles.push({
   x:player.x+player.w/2,
   y:player.y+player.h/2,
   vx:(Math.random()-.5)*600,
   vy:(Math.random()-.5)*600,
   life:1,
   size:2+Math.random()*5
  });
 }
 flash=.3;
}

function die(){
 if(dead)return;
 dead=true;
 burst();
}

function update(dt){
 if(!started||dead||won)return;
 dt=Math.min(dt,.035);
 cam+=SPEED*dt;
 player.x=cam+180;
 player.vy+=GRAVITY*dt;
 player.y+=player.vy*dt;
 if(player.y>=GROUND-player.h){
  player.y=GROUND-player.h;
  player.vy=0;
  player.onGround=true;
 }
 if(!player.onGround)player.rot+=dt*5;
 else player.rot=Math.round(player.rot/(Math.PI/2))*(Math.PI/2);
 if(collision())die();
 progress=Math.min(100,cam/(levelLength)*100);
 if(cam>levelLength){
  won=true;
  progress=100;
 }
 particles.forEach(p=>{
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vy+=700*dt;p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);
 flash=Math.max(0,flash-dt);
}

function drawBackground(){
 ctx.fillStyle='#182b4d';
 ctx.fillRect(0,0,W,H);

 // gradient
 let grad=ctx.createLinearGradient(0,0,0,H);
 grad.addColorStop(0,'#152449');
 grad.addColorStop(1,'#215b8a');
 ctx.fillStyle=grad;
 ctx.fillRect(0,0,W,H);

 // Grid
 ctx.strokeStyle='rgba(110,190,255,.10)';
 ctx.lineWidth=1;
 let offset=cam%42;
 for(let x=-offset;x<W;x+=42){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=0;y<H;y+=42){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 // Background blocks
 for(let i=0;i<20;i++){
  let x=((i*370-cam*.22)% (W+500));
  if(x<0)x+=W+500;
  let hh=100+(i%4)*50;
  ctx.fillStyle='rgba(31,72,115,.25)';
  ctx.fillRect(x,H-hh-70,70,hh);
 }
}

function drawGround(){
 let g=GROUND;
 ctx.fillStyle='#263b5c';
 ctx.fillRect(0,g,W,H-g);
 ctx.fillStyle='#64e5ff';
 ctx.fillRect(0,g,W,4);

 let offset=cam%42;
 for(let x=-offset;x<W;x+=42){
  ctx.strokeStyle='rgba(120,220,255,.25)';
  ctx.strokeRect(x,g+4,42,42);
 }
}

function drawObstacle(o){
 let x=o.x-cam+180;
 if(x<-100||x>W+100)return;

 if(o.type==='block'){
  ctx.fillStyle='#39d7ff';
  ctx.fillRect(x,GROUND-42,42,42);
  ctx.fillStyle='#1d86be';
  ctx.fillRect(x+5,GROUND-37,32,32);
  ctx.strokeStyle='#a8f5ff';
  ctx.lineWidth=3;
  ctx.strokeRect(x+5,GROUND-37,32,32);
  return;
 }

 ctx.fillStyle='#ffffff';
 ctx.beginPath();
 ctx.moveTo(x,GROUND);
 ctx.lineTo(x+42,GROUND);
 ctx.lineTo(x+21,GROUND-40);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle='#54e8ff';
 ctx.beginPath();
 ctx.moveTo(x+8,GROUND-3);
 ctx.lineTo(x+21,GROUND-29);
 ctx.lineTo(x+34,GROUND-3);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle='#c4faff';
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(x+21,GROUND-40);
 ctx.lineTo(x+21,GROUND);
 ctx.stroke();
}

function drawPlayer(){
 if(dead)return;
 let x=180,y=player.y;
 ctx.save();
 ctx.translate(x+17,y+17);
 ctx.rotate(player.rot);

 ctx.shadowColor='#5df4ff';
 ctx.shadowBlur=15;
 ctx.fillStyle='#5deaff';
 ctx.fillRect(-17,-17,34,34);
 ctx.shadowBlur=0;

 ctx.fillStyle='#2386c5';
 ctx.fillRect(-12,-12,24,24);

 ctx.strokeStyle='#bdfbff';
 ctx.lineWidth=3;
 ctx.strokeRect(-12,-12,24,24);

 // eyes
 ctx.fillStyle='#fff';
 ctx.fillRect(-8,-4,7,7);
 ctx.fillRect(3,-4,7,7);
 ctx.fillStyle='#14233c';
 ctx.fillRect(-5,-1,3,3);
 ctx.fillRect(6,-1,3,3);

 ctx.restore();
}

function drawParticles(){
 particles.forEach(p=>{
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.fillStyle='#75efff';
  ctx.fillRect(p.x-cam+180,p.y,p.size,p.size);
 });
 ctx.globalAlpha=1;
}

function drawProgress(){
 ctx.fillStyle='rgba(0,0,0,.4)';
 ctx.fillRect(W/2-120,15,240,12);
 ctx.fillStyle='#43dcff';
 ctx.fillRect(W/2-120,15,240*progress/100,12);
 ctx.strokeStyle='#c0efff';
 ctx.strokeRect(W/2-120,15,240,12);
 ctx.fillStyle='#fff';
 ctx.font='12px Arial';
 ctx.textAlign='center';
 ctx.fillText(Math.floor(progress)+'%',W/2,40);

 ctx.textAlign='left';
 ctx.fillText('ATTEMPT '+attempts,15,25);
 ctx.textAlign='right';
 ctx.fillText('STEREO RUSH',W-15,25);
}

function drawMenu(){
 ctx.fillStyle='rgba(5,10,22,.75)';
 ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';
 ctx.shadowColor='#40eaff';ctx.shadowBlur=20;
 ctx.fillStyle='#fff';
 ctx.font='bold 48px Arial';
 ctx.fillText('GEOMETRY DASH',W/2,H/2-60);
 ctx.shadowBlur=0;
 ctx.font='bold 28px Arial';
 ctx.fillStyle='#4eeaff';
 ctx.fillText('STEREO RUSH',W/2,H/2-15);
 ctx.font='18px Arial';
 ctx.fillStyle='#fff';
 ctx.fillText('НАЖМИ, ЧТОБЫ ИГРАТЬ',W/2,H/2+50);
 ctx.font='13px Arial';
 ctx.fillStyle='#9ab7d9';
 ctx.fillText('SPACE / CLICK / TAP — JUMP',W/2,H/2+90);
}

function drawDeath(){
 if(!dead)return;
 ctx.fillStyle='rgba(10,12,22,.7)';
 ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';
 ctx.fillStyle='#ff5f77';
 ctx.font='bold 42px Arial';
 ctx.fillText('CRASH!',W/2,H/2-30);
 ctx.fillStyle='#fff';
 ctx.font='18px Arial';
 ctx.fillText('НАЖМИ, ЧТОБЫ ПОВТОРИТЬ',W/2,H/2+25);
 ctx.font='14px Arial';
 ctx.fillStyle='#9cb6d5';
 ctx.fillText('ATTEMPT '+attempts,W/2,H/2+60);
}

function drawWin(){
 if(!won)return;
 ctx.fillStyle='rgba(10,12,22,.75)';
 ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';
 ctx.fillStyle='#5bffff';
 ctx.font='bold 45px Arial';
 ctx.fillText('LEVEL COMPLETE!',W/2,H/2-35);
 ctx.fillStyle='#fff';
 ctx.font='20px Arial';
 ctx.fillText('100%',W/2,H/2+10);
 ctx.font='16px Arial';
 ctx.fillText('НАЖМИ, ЧТОБЫ ИГРАТЬ СНОВА',W/2,H/2+60);
}

function draw(){
 drawBackground();
 drawGround();
 all.forEach(drawObstacle);
 drawPlayer();
 drawParticles();
 drawProgress();
 drawDeath();
 drawWin();
 if(menu)drawMenu();
 if(flash>0){
  ctx.fillStyle='rgba(255,255,255,'+flash+')';
  ctx.fillRect(0,0,W,H);
 }
}

function loop(t){
 let dt=(t-last)/1000;
 last=t;
 update(dt||0);
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
</body>
</html>
